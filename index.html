<!DOCTYPE html>
<html lang="en">
   <head>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
      <meta charset="UTF-8">
      <title>Be My Valentine </title>
      <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }
         body {
         height: 100vh;
         margin: 0;
         display: flex;
         align-items: center;
         justify-content: center;
         font-family: 'Poppins', sans-serif;
         overflow: hidden;

        /* Deep romantic night gradient */
         background: radial-gradient(circle at top, #2a003f 0%, #0a001a 40%, #000000 100%);
         color: white;
        }
         body::before {
         content: "";
         position: absolute;
         width: 600px;
         height: 600px;
         background: rgba(255, 77, 109, 0.25);
         filter: blur(120px);
         top: -150px;
         left: -150px;
         z-index: 0;
        }
         .confetti {
         position: fixed;
         width: 8px;
         height: 8px;
         background-color: red;
         top: -10px;
         animation: fall 3s linear forwards;
         opacity: 0.8;
         }
         @keyframes fall {
         to {
         transform: translateY(110vh) rotate(360deg);
         }
         }
         .heart {
         position: fixed;
         bottom: -20px;
         font-size: 24px;
         animation: floatUp 3s ease-in forwards;
         }
         .star {
        position: fixed;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        opacity: 0.7;
        animation: twinkle 3s infinite ease-in-out alternate;
        }
        .glow-heart {
        position: fixed;
        bottom: -30px;
        font-size: 20px;
        color: #ff4d9d;
        text-shadow:
            0 0 6px #ff4d9d,
            0 0 12px #ff4d9d,
            0 0 20px #ff80bf;
        animation: floatHeart linear forwards;
        pointer-events: none;
        z-index: 0;
        }

        @keyframes floatHeart {
        to {
            transform: translateY(-110vh) scale(1.4);
            opacity: 0;
        }
        }
        @keyframes twinkle {
        from { opacity: 0.2; transform: scale(1); }
        to   { opacity: 1; transform: scale(1.6); }
        }
         @keyframes floatUp {
         to {
         transform: translateY(-110vh);
         opacity: 0;
         }
         }
         .card {
         position: relative;
         overflow: hidden; 
         z-index: 2;
         width: 360px;
         padding: 45px 35px;
         border-radius: 28px;
         background: rgba(255, 255, 255, 0.92);
         backdrop-filter: blur(14px);
         text-align: center;
         box-shadow: 0 25px 70px rgba(0, 0, 0, 0.18);
         animation: fadeUp 1.2s ease;
         }
         h1 {
         font-family: 'Great Vibes', cursive;
         font-size: 42px;
         color: #ff4d6d;
         margin-bottom: 25px;
         }
         button {
         border: none;
         border-radius: 50px;
         padding: 12px 26px;
         font-size: 15px;
         font-weight: 600;
         margin: 8px;
         cursor: pointer;
         transition: 0.35s ease;
         }
         #yes {
         background: linear-gradient(45deg, #ff4d6d, #ff758f);
         color: white;
         box-shadow: 0 8px 25px rgba(255, 77, 109, 0.5);
         }
         #yes:hover {
         transform: scale(1.12);
           box-shadow: 0 12px 35px rgba(255, 77, 109, 0.7);
         }
         /* NO button */
         #no {
         background: #e9ecef;
         color: #444;
         position: absolute;
         }
         #message {
         margin-top: 18px;
         color: #ff4d6d;
         font-size: 16px;
         display: none;
         }
         #finalText {
         margin-top: 22px;
         font-size: 20px;
         line-height: 1.7;
         color: #333;
         animation: fadeIn 2s ease;
        }
        .petal {
        position: fixed;
        top: -40px;
        font-size: 22px;
        pointer-events: none;
        animation: fall linear forwards;
        opacity: 0.9;
        z-index: 0;
        }
        @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
            opacity: 0.7;
        }
        }        
        @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(25px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
        }

        @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
        }
        .moon {
        
        position: fixed;
        top: 35%;              /* slightly above card center */
        left: 50%;
        transform: translate(-50%, -50%);

        width: 300px;
        height: 300px;
        border-radius: 50%;

        background: radial-gradient(circle at 30% 30%, #fff6cc, #ffe680 60%, #ffd54d);

        box-shadow:
            0 0 80px rgba(255, 230, 128, 0.7),
            0 0 160px rgba(255, 230, 128, 0.45),
            0 0 240px rgba(255, 230, 128, 0.25);

        z-index: 0;
        pointer-events: none;


        }

        /* soft breathing glow */
        @keyframes moonPulse {
        from {
            transform: translate(-50%, -60%) scale(1);
            opacity: 0.9;
        }
        to {
            transform: translate(-50%, -60%) scale(1.08);
            opacity: 1;
        }
        }
        .fade-out {
        animation: fadeOut 0.6s ease forwards;
        }

        @keyframes fadeOut {
        to {
            opacity: 0;
            transform: scale(0.8);
        }
        }
        .moon-bright {
        animation: moonBright 2s ease forwards;
        }

        @keyframes moonBright {
        from {
            transform: translate(-50%, -50%) scale(1);
            box-shadow:
            0 0 80px rgba(255, 230, 128, 0.7),
            0 0 160px rgba(255, 230, 128, 0.45),
            0 0 240px rgba(255, 230, 128, 0.25);
        }
        to {
            transform: translate(-50%, -50%) scale(1.25);
            box-shadow:
            0 0 120px rgba(255, 230, 128, 0.9),
            0 0 240px rgba(255, 230, 128, 0.7),
            0 0 360px rgba(255, 230, 128, 0.5);
        }
        }
        .teddy {
        width: 120px;
        height: auto;
        margin-top: -90px;      /* makes teddy sit above card */
        margin-bottom: 10px;

        filter: drop-shadow(0 8px 18px rgba(0,0,0,0.25));

        animation: floatTeddy 3s ease-in-out infinite;
        }

        /* soft floating animation */
        @keyframes floatTeddy {
        0%   { transform: translateY(0); }
        50%  { transform: translateY(-10px); }
        100% { transform: translateY(0); }
        }
        .no-message {
        margin-top: 12px;
        font-size: 15px;
        color: #ff4d6d;
        min-height: 22px;

        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .no-message.show {
        opacity: 1;
        transform: translateY(0);
        }
        .final-full {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;

        font-size: 22px;
        line-height: 1.7;
        color: #ff4d6d;
        font-weight: 500;

        animation: fadeIn 2s ease;
        }
        .final-full {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;

        animation: finalFade 2s ease;
        }

        /* Name (big romantic focus) */
        .final-name {
        font-family: 'Great Vibes', cursive;
        font-size: 38px;
        color: #ff4d6d;
        margin-bottom: 25px;

        text-shadow: 0 0 12px rgba(255, 77, 109, 0.35);
        }

        /* Main emotional line */
        .final-line {
        font-size: 12px;
        line-height: 1.8;
        color: #ff6b81;
        max-width: 260px;
        margin-bottom: 30px;
        }

        /* Final wish */
        .final-wish {
        font-size: 18px;
        color: #ff4d6d;
        letter-spacing: 0.5px;

        opacity: 0.9;
        }

        /* Soft cinematic fade */
        @keyframes finalFade {
        from {
            opacity: 0;
            transform: scale(0.96);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
        }


        
      </style>
   </head>
   <body>
      <div class="moon"></div>
      <div class="card">
         <h1>Hi Arunisha</h1>
         <h1>Will you be my Valentine? </h1>
         <div class="buttons">
            <button id="yes" onclick="sayYes()">Hanji 💞</button>
            <button id="no">No😭</button>
         </div>
         <div id="noMsg" class="no-message"></div>
         <div id="message"><b>Yaaay!!  I knew it </b></div>
         <div id="finalScreen" style="display:none;">
            <h2 id="finalText"></h2>
        </div>
      </div>
      <script>
         const noBtn = document.getElementById("no");
         const noMessages = [
            "Are you sure? 🥺",
            "Oii Think again nah bacha… 💖",
            "Please don’t say no bacha 😭",
            "My heart will break 💔",
            "Only YES works here 😌"
            ];
        let noMsgTimeout;
         function showNoMessage() {
            const msgBox = document.getElementById("noMsg");

            // clear previous timeout so animation restarts smoothly
            clearTimeout(noMsgTimeout);

            const random =
                noMessages[Math.floor(Math.random() * noMessages.length)];

            msgBox.textContent = random;

            // show with animation
            msgBox.classList.add("show");

            // hide smoothly after 2 seconds
            noMsgTimeout = setTimeout(() => {
                msgBox.classList.remove("show");
            }, 2000);
        }
         noBtn.addEventListener("mouseover", () => {
            moveButton();
            showNoMessage();
        });

         noBtn.addEventListener("touchstart", () => {
            moveButton();
            showNoMessage();
        });
         for (let i = 0; i < 150; i++) {
            const star = document.createElement("div");
            star.className = "star";
            star.style.left = Math.random() * 100 + "vw";
            star.style.top = Math.random() * 100 + "vh";
            star.style.animationDuration = (Math.random() * 3 + 2) + "s";
            document.body.appendChild(star);
        }
         
         function moveButton() {
           const card = document.querySelector(".card");
            const rect = card.getBoundingClientRect();

            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            const maxX = rect.width - btnWidth;
            const maxY = rect.height - btnHeight;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            noBtn.style.position = "absolute";
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
         }
         const girlName = "Your Love";
         
         function sayYes() {
            const msg = document.getElementById("message");
            msg.style.display = "block";
            const moon = document.querySelector(".moon");
            moon.classList.add("moon-bright");
            noBtn.classList.add("fade-out");
            
            document.getElementById("yes").classList.add("fade-out");

            

                setTimeout(() => {
                    noBtn.remove();
                    document.getElementById("yes").remove()
                }, 600);
            
            
            let duration = 5 * 1000; // 5 minutes
            let end = Date.now() + duration;
            
            let interval = setInterval(() => {
            // stop after 5 minutes
            if (Date.now() > end) {
                clearInterval(interval);
                
                showFinalMessage(); 
                return;
            }
            
            
            createConfetti();
            createHeart();
         
         }, 50); // create particles every 200ms
         }
         
         
         // 🎉 CONFETTI
         function createConfetti() {
            const confetti = document.createElement("div");
            confetti.className = "confetti";
            
            confetti.style.left = Math.random() * 100 + "vw";
            confetti.style.backgroundColor =
            ["#ff4d6d", "#ffd166", "#06d6a0", "#4dabf7"]
            [Math.floor(Math.random() * 4)];
            
            confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
            
            document.body.appendChild(confetti);
            
            setTimeout(() => confetti.remove(), 5000);
         }
         
         
         // ❤️ HEART
         function createHeart() {
         const heart = document.createElement("div");
         heart.className = "heart";
         
         const hearts = ["❤️","💖","💘","💕","💞"];
         heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
         
         heart.style.left = Math.random() * 100 + "vw";
         heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
         
         document.body.appendChild(heart);
         
         setTimeout(() => heart.remove(), 5000);
         }

         function showFinalMessage() {
            
            const card = document.querySelector(".card");

            card.innerHTML = `
                <div class="final-full">
                <div class="final-name">💖Hi Arunisha</div>

                <div class="final-line">
                    I may not know how our story began,
                    and I may not know where the future will lead us…
                    but I promise this—
                    no matter what comes,
                    I will always want to start my every tomorrow with you,
                    my Valentine.
                    <br>
                    And yes… I know you are a little bit mad sometimes 😄
                    sometimes you understand things in the cutest wrong way…
                    but maybe that’s what makes you so special.
                    <br>
                    Because the truth is—
                    you are too sweet, too cute,
                    and my most favorite person .
                    <br>
                    So… thank you, mera bacha,
                    for saying yes to us. 💖❤️
                </div>

                <div class="final-wish">
                    Happy Valentine’s Day 💌
                </div>
                <div class="final-line">
                    At the end, I only want to say one thing…
                    <br>
                     <b>Yeh Duniya Mile Na Mile Hum Ko,</b>
                     <b>Khushiyan Bhaga Dengi Har Gham Ko,</b>
                     <b>Tum Sath Ho Phir Kya Baki</b>
                     <b>Hai, Mere Liye Tum Kafi Ho,❤️💌</b>
                </div>
                </div>
            `;
        } 
        function createPetal() {
            const petal = document.createElement("div");
            petal.className = "petal";

            const petals = ["🌹","🌺","🌸","💮"];
            petal.innerHTML = petals[Math.floor(Math.random() * petals.length)];

            petal.style.left = Math.random() * 100 + "vw";
            petal.style.animationDuration = (Math.random() * 5 + 5) + "s"; // slow fall

            document.body.appendChild(petal);

            setTimeout(() => petal.remove(), 10000);
        }

        // continuous petals
        setInterval(createPetal, 400);
        function createGlowHeart() {
            const heart = document.createElement("div");
            heart.className = "glow-heart";
            heart.innerHTML = "❤";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 6 + 6) + "s";

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 12000);
        }

        setInterval(createGlowHeart, 800);
       function typeWriter(text, elementId, speed = 60) {
            let i = 0;
            const el = document.getElementById(elementId);
            el.innerHTML = "";

            function typing() {
                if (i < text.length) {
                el.innerHTML += text.charAt(i);
                i++;
                setTimeout(typing, speed);
                }
            }

            typing();
        }
        function stopRomanticEffects() {
            // stop floating hearts / petals intervals if you created them
            clearInterval(window.heartInterval);
            clearInterval(window.petalInterval);
        }

        </script>
   </body>
</html>
